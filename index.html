<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zero Day Streams - Premium Anime Streaming</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #ff0047;
            --primary-dark: #cc0039;
            --primary-light: #ff1a5f;
            --accent: #00d4ff;
            --bg: #0a0e27;
            --bg-secondary: #1a1f3a;
            --bg-tertiary: #242d4d;
            --text: #ffffff;
            --text-muted: #a0a8c0;
            --border: #2a3554;
            --success: #00ff88;
            --warning: #ffa500;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* ===== HEADER ===== */
        header {
            background: linear-gradient(180deg, rgba(10, 14, 39, 0.95) 0%, rgba(10, 14, 39, 0.85) 100%);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            padding: 1rem 2rem;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 8px 32px rgba(255, 0, 71, 0.1);
        }

        .header-container {
            max-width: 1600px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            gap: 2rem;
        }

        .logo {
            font-family: 'Poppins', sans-serif;
            font-size: 1.8rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -1px;
            white-space: nowrap;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .logo::before {
            content: '⚡';
            font-size: 1.5rem;
        }

        .search-container {
            flex: 1;
            max-width: 500px;
        }

        .search-wrap {
            display: flex;
            align-items: center;
            background: var(--bg-tertiary);
            border: 2px solid var(--border);
            border-radius: 12px;
            padding: 0.5rem;
            transition: all 0.3s ease;
        }

        .search-wrap:focus-within {
            border-color: var(--accent);
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.2);
        }

        .search-wrap input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text);
            padding: 0.8rem 1rem;
            font-size: 0.95rem;
            font-family: 'Inter', sans-serif;
        }

        .search-wrap input::placeholder {
            color: var(--text-muted);
        }

        .search-wrap button {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
            border: none;
            color: white;
            padding: 0.8rem 1.5rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            font-size: 0.9rem;
            white-space: nowrap;
        }

        .search-wrap button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(255, 0, 71, 0.3);
        }

        .nav-tabs {
            display: flex;
            gap: 0.5rem;
            margin-left: auto;
            flex-wrap: wrap;
        }

        .nav-tab {
            background: transparent;
            border: 1.5px solid var(--border);
            color: var(--text-muted);
            padding: 0.6rem 1.2rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            font-size: 0.9rem;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .nav-tab:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .nav-tab.active {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
            border-color: var(--primary);
            color: white;
            box-shadow: 0 8px 20px rgba(255, 0, 71, 0.3);
        }

        /* ===== MAIN CONTENT ===== */
        main {
            max-width: 1600px;
            margin: 0 auto;
            padding: 3rem 2rem;
        }

        .section-header {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .section-title {
            font-family: 'Poppins', sans-serif;
            font-size: 2rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: -1px;
            background: linear-gradient(135deg, var(--accent) 0%, var(--primary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .section-title::before {
            content: '';
            display: inline-block;
            width: 4px;
            height: 2rem;
            background: linear-gradient(180deg, var(--primary) 0%, var(--accent) 100%);
            margin-right: 1rem;
            border-radius: 2px;
        }

        /* ===== GRID ===== */
        .anime-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 1.5rem;
            margin-bottom: 3rem;
        }

        .anime-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            group: true;
        }

        .anime-card:hover {
            border-color: var(--primary);
            transform: translateY(-8px);
            box-shadow: 0 12px 40px rgba(255, 0, 71, 0.25);
        }

        .anime-card:hover .anime-card-overlay {
            opacity: 1;
        }

        .anime-card-image {
            width: 100%;
            aspect-ratio: 3/4;
            object-fit: cover;
            display: block;
            background: var(--bg-tertiary);
            transition: transform 0.3s ease;
        }

        .anime-card:hover .anime-card-image {
            transform: scale(1.05);
        }

        .anime-card-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255, 0, 71, 0.8) 0%, rgba(0, 212, 255, 0.8) 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .anime-card-play-btn {
            width: 60px;
            height: 60px;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
        }

        .anime-card-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 0.4rem 0.8rem;
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--accent);
            z-index: 10;
        }

        .anime-card-info {
            padding: 1rem;
        }

        .anime-card-title {
            font-size: 0.95rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            overflow: hidden;
            text-overflow: ellipsis;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            line-height: 1.3;
        }

        .anime-card-subtitle {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        /* ===== LOADING ===== */
        .loading-state {
            text-align: center;
            padding: 4rem 2rem;
            color: var(--text-muted);
        }

        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 3px solid var(--border);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 1rem;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* ===== PLAYER PAGE ===== */
        .player-page {
            display: none;
        }

        .back-button {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background: var(--bg-secondary);
            border: 1.5px solid var(--border);
            color: var(--text-muted);
            padding: 0.8rem 1.5rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            margin-bottom: 2rem;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .back-button:hover {
            border-color: var(--primary);
            color: var(--primary);
            background: rgba(255, 0, 71, 0.1);
            transform: translateX(-4px);
        }

        .player-layout {
            display: grid;
            grid-template-columns: 1fr 320px;
            gap: 2rem;
        }

        @media (max-width: 1024px) {
            .player-layout {
                grid-template-columns: 1fr;
            }
            .player-sidebar {
                order: -1;
            }
        }

        .player-container {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
            aspect-ratio: 16/9;
            position: relative;
        }

        .player-placeholder {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        .player-container iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        /* ===== CONTROLS ===== */
        .control-section {
            margin-top: 1.5rem;
            padding: 1.2rem;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 10px;
        }

        .control-label {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 1rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .control-buttons {
            display: flex;
            gap: 0.6rem;
            flex-wrap: wrap;
        }

        .control-button {
            background: var(--bg-tertiary);
            border: 1.5px solid var(--border);
            color: var(--text-muted);
            padding: 0.7rem 1rem;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.8rem;
            transition: all 0.2s ease;
            white-space: nowrap;
            text-transform: uppercase;
        }

        .control-button:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .control-button.active {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
            border-color: var(--primary);
            color: white;
            box-shadow: 0 6px 16px rgba(255, 0, 71, 0.3);
        }

        /* ===== EPISODES ===== */
        .episodes-section {
            margin-top: 1.5rem;
        }

        .episodes-label {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 1rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .episodes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(48px, 1fr));
            gap: 0.6rem;
            max-height: 280px;
            overflow-y: auto;
            padding-right: 0.5rem;
        }

        .episodes-grid::-webkit-scrollbar {
            width: 6px;
        }

        .episodes-grid::-webkit-scrollbar-track {
            background: var(--bg-tertiary);
            border-radius: 3px;
        }

        .episodes-grid::-webkit-scrollbar-thumb {
            background: var(--primary);
            border-radius: 3px;
        }

        .episodes-grid::-webkit-scrollbar-thumb:hover {
            background: var(--primary-light);
        }

        .episode-button {
            background: var(--bg-tertiary);
            border: 1.5px solid var(--border);
            color: var(--text-muted);
            padding: 0.6rem;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 700;
            font-size: 0.8rem;
            transition: all 0.2s ease;
            min-height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .episode-button:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .episode-button.active {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
            border-color: var(--primary);
            color: white;
            box-shadow: 0 6px 16px rgba(255, 0, 71, 0.3);
        }

        /* ===== SIDEBAR ===== */
        .player-sidebar {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1.5rem;
            height: fit-content;
        }

        .sidebar-cover {
            width: 100%;
            aspect-ratio: 3/4;
            object-fit: cover;
            border-radius: 10px;
            margin-bottom: 1.5rem;
            border: 1px solid var(--border);
        }

        .sidebar-title {
            font-family: 'Poppins', sans-serif;
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            line-height: 1.3;
        }

        .sidebar-score {
            font-size: 0.85rem;
            color: var(--accent);
            margin-bottom: 1rem;
            font-weight: 700;
        }

        .sidebar-description {
            font-size: 0.8rem;
            color: var(--text-muted);
            line-height: 1.6;
            margin-bottom: 1.2rem;
            max-height: 120px;
            overflow: hidden;
        }

        .sidebar-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .sidebar-tag {
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            color: var(--accent);
            padding: 0.3rem 0.8rem;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: capitalize;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            header {
                padding: 1rem;
            }

            .header-container {
                gap: 1rem;
                flex-wrap: wrap;
            }

            .logo {
                font-size: 1.4rem;
            }

            .search-container {
                order: 3;
                max-width: 100%;
                flex-basis: 100%;
            }

            .nav-tabs {
                margin-left: 0;
                order: 4;
                flex-basis: 100%;
                gap: 0.3rem;
            }

            .nav-tab {
                flex: 1;
                font-size: 0.8rem;
                padding: 0.5rem 0.8rem;
            }

            .anime-grid {
                grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
                gap: 1rem;
            }

            .section-title {
                font-size: 1.5rem;
            }

            main {
                padding: 2rem 1rem;
            }
        }
    </style>
</head>
<body>
    <!-- HEADER -->
    <header>
        <div class="header-container">
            <div class="logo">Zero Day</div>
            <div class="search-container">
                <div class="search-wrap">
                    <input type="text" id="searchInput" placeholder="Search anime...">
                    <button onclick="handleSearch()">Search</button>
                </div>
            </div>
            <div class="nav-tabs">
                <button class="nav-tab active" onclick="switchTab('trending', this)">Trending</button>
                <button class="nav-tab" onclick="switchTab('popular', this)">Popular</button>
                <button class="nav-tab" onclick="switchTab('upcoming', this)">Upcoming</button>
            </div>
        </div>
    </header>

    <!-- MAIN CONTENT -->
    <main>
        <!-- HOME PAGE -->
        <div id="homePage">
            <div class="section-header">
                <h1 class="section-title" id="sectionTitle">Trending Now</h1>
            </div>
            <div class="anime-grid" id="animeGrid">
                <div class="loading-state">
                    <div class="loading-spinner"></div>
                    <p>Loading anime...</p>
                </div>
            </div>
        </div>

        <!-- PLAYER PAGE -->
        <div id="playerPage" class="player-page">
            <button class="back-button" onclick="goHome()">← Back to Browse</button>
            
            <div class="player-layout">
                <div>
                    <div class="player-container" id="playerContainer">
                        <div class="player-placeholder">
                            <span style="font-size: 3rem;">▶</span>
                            Select an episode to start watching
                        </div>
                    </div>

                    <!-- Language Selection -->
                    <div class="control-section" id="languageSection" style="display: none;">
                        <div class="control-label">Language</div>
                        <div class="control-buttons" id="languageContainer"></div>
                    </div>

                    <!-- Server Selection -->
                    <div class="control-section" id="serverSection" style="display: none;">
                        <div class="control-label">Streaming Server</div>
                        <div class="control-buttons" id="serverContainer"></div>
                    </div>

                    <!-- Episodes -->
                    <div class="episodes-section">
                        <div class="episodes-label">Episodes</div>
                        <div class="episodes-grid" id="episodesGrid"></div>
                    </div>
                </div>

                <!-- SIDEBAR -->
                <div class="player-sidebar" id="playerSidebar">
                    <div class="loading-state">
                        <div class="loading-spinner"></div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        const GRAPHQL_URL = 'https://graphql.anilist.co';
        
        let currentAnime = null;
        let currentEpisode = 1;
        let currentServer = 0;
        let currentLanguage = 'sub';

        const QUERIES = {
            trending: `query {
                Page(perPage: 24) {
                    media(sort: TRENDING_DESC, type: ANIME, isAdult: false) {
                        id title { romaji } coverImage { large } episodes status averageScore
                    }
                }
            }`,
            popular: `query {
                Page(perPage: 24) {
                    media(sort: POPULARITY_DESC, type: ANIME, isAdult: false) {
                        id title { romaji } coverImage { large } episodes status averageScore
                    }
                }
            }`,
            upcoming: `query {
                Page(perPage: 24) {
                    media(sort: POPULARITY_DESC, type: ANIME, status: NOT_YET_RELEASED, isAdult: false) {
                        id title { romaji } coverImage { large } episodes status averageScore
                    }
                }
            }`,
            search: `query($search: String) {
                Page(perPage: 24) {
                    media(search: $search, type: ANIME, isAdult: false) {
                        id title { romaji } coverImage { large } episodes status averageScore
                    }
                }
            }`,
            details: `query($id: Int) {
                Media(id: $id, type: ANIME) {
                    id title { romaji english } coverImage { large extraLarge } episodes status averageScore genres description
                }
            }`
        };

        const SERVERS = [
            { name: 'VidLink', url: (id, ep) => `https://vidlink.pro/embed/anime/${id}/${ep}` },
            { name: 'VidSrc', url: (id, ep) => `https://vidsrc.me/embed/anime/${id}/${ep}` },
            { name: 'Anix', url: (id, ep) => `https://anix.to/embed?id=${id}&ep=${ep}` },
            { name: 'Hianime', url: (id, ep) => `https://hianime.to/embed?id=${id}&ep=${ep}` },
            { name: '9Anime', url: (id, ep) => `https://9anime.to/embed?id=${id}&ep=${ep}` },
            { name: 'StreamSB', url: (id, ep) => `https://streamsb.net/embed/${id}/${ep}` },
            { name: 'Sflix', url: (id, ep) => `https://sflix.to/embed/anime/${id}/${ep}` },
        ];

        async function graphqlQuery(query, variables = {}) {
            try {
                const response = await fetch(GRAPHQL_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify({ query, variables })
                });
                const result = await response.json();
                return result.data;
            } catch (error) {
                console.error('GraphQL Error:', error);
                return null;
            }
        }

        async function switchTab(tab, btn) {
            document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
            btn.classList.add('active');

            const titles = {
                trending: 'Trending Now',
                popular: 'Most Popular',
                upcoming: 'Coming Soon'
            };

            document.getElementById('sectionTitle').textContent = titles[tab];
            loadGrid(QUERIES[tab], {});
        }

        function handleSearch() {
            const searchTerm = document.getElementById('searchInput').value.trim();
            if (!searchTerm) return;

            document.getElementById('sectionTitle').textContent = `Results for "${searchTerm}"`;
            document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
            loadGrid(QUERIES.search, { search: searchTerm });
        }

        document.getElementById('searchInput')?.addEventListener('keypress', e => {
            if (e.key === 'Enter') handleSearch();
        });

        async function loadGrid(query, variables) {
            const grid = document.getElementById('animeGrid');
            grid.innerHTML = '<div class="loading-state"><div class="loading-spinner"></div><p>Loading...</p></div>';

            const data = await graphqlQuery(query, variables);
            if (!data?.Page?.media) {
                grid.innerHTML = '<div class="loading-state"><p>No anime found</p></div>';
                return;
            }

            grid.innerHTML = '';
            data.Page.media.forEach(anime => {
                const card = document.createElement('div');
                card.className = 'anime-card';
                card.innerHTML = `
                    <div style="position: relative;">
                        <img src="${anime.coverImage.large}" alt="${anime.title.romaji}" class="anime-card-image">
                        <div class="anime-card-overlay">
                            <div class="anime-card-play-btn">▶</div>
                        </div>
                        ${anime.averageScore ? `<div class="anime-card-badge">⭐ ${(anime.averageScore / 10).toFixed(1)}</div>` : ''}
                    </div>
                    <div class="anime-card-info">
                        <div class="anime-card-title">${anime.title.romaji}</div>
                        <div class="anime-card-subtitle">${anime.episodes || '?'} Episodes • ${anime.status}</div>
                    </div>
                `;
                card.onclick = () => openAnime(anime.id);
                grid.appendChild(card);
            });
        }

        async function openAnime(id) {
            document.getElementById('homePage').style.display = 'none';
            document.getElementById('playerPage').style.display = 'block';
            
            document.getElementById('playerContainer').innerHTML = `
                <div class="player-placeholder">
                    <span style="font-size: 3rem;">▶</span>
                    Select an episode to start watching
                </div>
            `;
            document.getElementById('languageSection').style.display = 'none';
            document.getElementById('serverSection').style.display = 'none';
            document.getElementById('episodesGrid').innerHTML = '';
            document.getElementById('playerSidebar').innerHTML = '<div class="loading-state"><div class="loading-spinner"></div></div>';

            const data = await graphqlQuery(QUERIES.details, { id });
            if (!data?.Media) return;

            currentAnime = data.Media;
            currentEpisode = 1;
            currentServer = 0;
            currentLanguage = 'sub';

            // Sidebar
            const desc = data.Media.description ? data.Media.description.replace(/<[^>]*>/g, '').slice(0, 200) + '...' : 'No description';
            const genres = (data.Media.genres || []).map(g => `<div class="sidebar-tag">${g}</div>`).join('');
            const score = data.Media.averageScore ? `⭐ ${(data.Media.averageScore / 10).toFixed(1)}/10` : 'N/A';

            document.getElementById('playerSidebar').innerHTML = `
                <img src="${data.Media.coverImage.extraLarge || data.Media.coverImage.large}" class="sidebar-cover">
                <div class="sidebar-title">${data.Media.title.english || data.Media.title.romaji}</div>
                <div class="sidebar-score">${score} • ${data.Media.status}</div>
                <div class="sidebar-description">${desc}</div>
                <div class="sidebar-tags">${genres}</div>
            `;

            // Episodes
            const epGrid = document.getElementById('episodesGrid');
            const totalEps = Math.min(data.Media.episodes || 1, 500);
            for (let i = 1; i <= totalEps; i++) {
                const btn = document.createElement('button');
                btn.className = 'episode-button';
                btn.textContent = i;
                btn.onclick = () => playEpisode(i, btn);
                epGrid.appendChild(btn);
            }
        }

        function playEpisode(ep, btn) {
            document.querySelectorAll('.episode-button').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentEpisode = ep;
            renderLanguages();
            renderServers();
            document.getElementById('languageSection').style.display = 'block';
            document.getElementById('serverSection').style.display = 'block';
            loadPlayer();
        }

        function renderLanguages() {
            const container = document.getElementById('languageContainer');
            container.innerHTML = '';
            ['sub', 'dub'].forEach(lang => {
                const btn = document.createElement('button');
                btn.className = 'control-button' + (lang === currentLanguage ? ' active' : '');
                btn.textContent = lang.toUpperCase();
                btn.onclick = () => {
                    currentLanguage = lang;
                    renderLanguages();
                    loadPlayer();
                };
                container.appendChild(btn);
            });
        }

        function renderServers() {
            const container = document.getElementById('serverContainer');
            container.innerHTML = '';
            SERVERS.forEach((server, idx) => {
                const btn = document.createElement('button');
                btn.className = 'control-button' + (idx === currentServer ? ' active' : '');
                btn.textContent = server.name;
                btn.onclick = () => {
                    currentServer = idx;
                    renderServers();
                    loadPlayer();
                };
                container.appendChild(btn);
            });
        }

        function loadPlayer() {
            if (!currentAnime) return;
            const url = SERVERS[currentServer].url(currentAnime.id, currentEpisode);
            document.getElementById('playerContainer').innerHTML = `
                <iframe src="${url}" allowfullscreen allow="autoplay;fullscreen;encrypted-media;picture-in-picture" referrerpolicy="no-referrer"></iframe>
            `;
        }

        function goHome() {
            document.getElementById('playerPage').style.display = 'none';
            document.getElementById('homePage').style.display = 'block';
            window.scrollTo(0, 0);
        }

        // Load initial data
        loadGrid(QUERIES.trending, {});
    </script>
</body>
</html>
